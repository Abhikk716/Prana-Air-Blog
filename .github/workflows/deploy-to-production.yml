# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Deploy to Dev

on:
  push:
    branches: ["production", "main"]
  pull_request:
    branches: ["production", "main"]

jobs:
  build:
    runs-on: ${{ github.ref_name == 'main' && 'pranaair-cms-dev' || 'pranaair-cms' }}

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Create env file
        run: |
          # Create and populate the .env file with required environment variables
          cat <<EOF > .env
          NEXT_PUBLIC_DOMAIN=${{ github.ref_name == 'main' && secrets.NEXT_PUBLIC_DOMAIN_DEV || secrets.NEXT_PUBLIC_DOMAIN }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          WP_API_URL=${{ secrets.WP_API_URL }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          NEXT_PUBLIC_CMS_SLUG=${{ secrets.NEXT_PUBLIC_CMS_SLUG }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
          GA4_PROPERTY_ID=${{ secrets.GA4_PROPERTY_ID }}
          GA4_CREDENTIALS_JSON=${{ secrets.GA4_CREDENTIALS_JSON }}
          EOF

      - name: Build app
        run: npm run build

      - name: Start / Reload PM2
        run: pm2 startOrReload ecosystem.config.js
